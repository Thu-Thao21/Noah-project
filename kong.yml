_format_version: "3.0"

services:
  - name: order-service
    url: http://order-api:8000
    routes:
      - name: order-route
        paths:
          - /orders
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          limit_by: ip

  - name: report-service
    url: http://order-api:8000
    routes:
      - name: report-route
        paths:
          - /report
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          limit_by: ip